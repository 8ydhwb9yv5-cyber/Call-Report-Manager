<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test Page 5</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body>
<div id="root">Loading...</div>
<script type="text/babel">

const { useState, useEffect, useMemo, useRef } = React;

let sb = null;

const COLORS = {
  navy: "#12233D", slate: "#4A5568", bg: "#F5F6F8", card: "#FFFFFF",
  border: "#E2E5EA", gold: "#A9803C", goldLight: "#F4EDE0",
  teal: "#0F6E6A", tealLight: "#E4F1F0", text: "#1A2333",
  textMuted: "#6B7385", danger: "#B3432E", dangerLight: "#F7E9E5",
};

const SEGMENTS = ["Corporate", "SME", "Institutional", "NBFC", "Government", "Retail Priority"];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { day: "2-digit", month: "short", year: "numeric" });
};
const fmtBalance = (n) => {
  const num = Number(String(n).replace(/[^0-9.-]/g, ""));
  if (isNaN(num)) return n || "—";
  return new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 }).format(num);
};

const ICONS = {
  building: "M4 21V4a1 1 0 011-1h9a1 1 0 011 1v17 M4 21h16 M9 7h1 M9 11h1 M9 15h1 M14 7h1 M14 11h1 M14 15h1 M15 21v-4a1 1 0 00-1-1h-4a1 1 0 00-1 1v4",
  calendar: "M8 2v4 M16 2v4 M3 10h18 M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z",
  message: "M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z",
  download: "M12 3v12 M7 10l5 5 5-5 M5 21h14",
  history: "M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8 M3 3v5h5 M12 7v5l4 2",
  plus: "M12 5v14 M5 12h14",
  trash: "M3 6h18 M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2 M19 6l-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6",
  pencil: "M12 20h9 M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z",
  chevronRight: "M9 18l6-6-6-6",
  search: "M11 19a8 8 0 100-16 8 8 0 000 16z M21 21l-4.35-4.35",
  x: "M18 6L6 18 M6 6l12 12",
  sparkles: "M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z",
  save: "M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z M17 21v-8H7v8 M7 3v5h8",
  arrowLeft: "M19 12H5 M12 19l-7-7 7-7",
  file: "M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6",
  check: "M22 11.08V12a10 10 0 11-5.93-9.14 M22 4L12 14.01l-3-3",
  upload: "M12 3v12 M7 8l5-5 5 5 M5 21h14",
  fileDown: "M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6 M12 11v6 M9.5 14.5L12 17l2.5-2.5",
  logOut: "M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4 M16 17l5-5-5-5 M21 12H9",
  lock: "M5 11h14v10H5z M8 11V7a4 4 0 018 0v4",
  mail: "M4 4h16v16H4z M22 6l-10 7L2 6",
  user: "M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2 M12 11a4 4 0 100-8 4 4 0 000 8z",
  alert: "M12 9v4 M12 17h.01 M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z",
};

function Icon({ name, size = 15, color = "currentColor", spin }) {
  const d = ICONS[name];
  if (!d) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2"
      strokeLinecap="round" strokeLinejoin="round" className={spin ? "animate-spin" : ""}>
      {d.split(" M").map((seg, i) => (<path key={i} d={i === 0 ? seg : "M" + seg} />))}
    </svg>
  );
}

function Field({ label, children, hint }) {
  return (
    <div style={{ marginBottom: 18 }}>
      <label style={{ display: "block", fontSize: 12.5, fontWeight: 600, color: COLORS.navy, letterSpacing: 0.2, marginBottom: 6, textTransform: "uppercase" }}>{label}</label>
      {children}
      {hint && <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 4 }}>{hint}</div>}
    </div>
  );
}

const inputStyle = { width: "100%", padding: "9px 12px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 14.5, color: COLORS.text, background: "#fff", fontFamily: "inherit", boxSizing: "border-box" };
const readonlyBox = { ...inputStyle, background: "#FAFBFC", color: COLORS.slate };

function Pill({ children, tone = "neutral" }) {
  const tones = { neutral: { bg: "#EEF0F3", color: COLORS.slate }, gold: { bg: COLORS.goldLight, color: "#7A5B24" }, teal: { bg: COLORS.tealLight, color: COLORS.teal } };
  const t = tones[tone];
  return <span style={{ background: t.bg, color: t.color, fontSize: 11.5, fontWeight: 600, padding: "3px 9px", borderRadius: 20, letterSpacing: 0.2 }}>{children}</span>;
}

function SectionCard({ title, icon, children, right }) {
  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 22, marginBottom: 18 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
          {icon && <Icon name={icon} size={16} color={COLORS.gold} />}
          <div style={{ fontSize: 13.5, fontWeight: 700, color: COLORS.navy, letterSpacing: 0.3, textTransform: "uppercase" }}>{title}</div>
        </div>
        {right}
      </div>
      {children}
    </div>
  );
}

function ActionButton({ icon, label, onClick, primary, disabled, danger }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: "flex", alignItems: "center", gap: 8, padding: "10px 18px", borderRadius: 7,
      border: primary || danger ? "none" : `1px solid ${COLORS.border}`,
      background: disabled ? "#E5E7EB" : primary ? COLORS.navy : danger ? COLORS.dangerLight : "#fff",
      color: disabled ? "#9AA0AC" : primary ? "#fff" : danger ? COLORS.danger : COLORS.navy,
      fontSize: 13.5, fontWeight: 600, opacity: disabled ? 0.7 : 1, whiteSpace: "nowrap",
    }}>
      <Icon name={icon} size={15} /> {label}
    </button>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<div>First half loaded OK - <ActionButton icon="save" label="Test Button" primary /></div>);

</script>
</body>
</html>
