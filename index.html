// Spelling/grammar correction — calls Claude directly from the browser using a
// key the user supplies and stores only in this browser (Settings tab).
async function callClaude(apiKey, systemPrompt, userPrompt) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{ role: "user", content: userPrompt }],
    }),
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`API error ${response.status}: ${errText.slice(0, 200)}`);
  }
  const data = await response.json();
  return (data.content || []).map((b) => (b.type === "text" ? b.text : "")).join("\n");
}

// ---------------- Auth ----------------

function AuthView({ onSession }) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());

  const handleSignup = async () => {
    setError(""); setInfo("");
    if (!emailValid) return setError("Enter a valid email address.");
    if (password.length < 6) return setError("Password must be at least 6 characters.");
    if (password !== confirmPassword) return setError("Passwords do not match.");
    setBusy(true);
    const { data, error: err } = await sb.auth.signUp({ email: email.trim(), password });
    setBusy(false);
    if (err) return setError(err.message);
    if (data.session) { onSession(data.session); return; }
    setInfo("Account created. Check your email to confirm, then log in.");
    setMode("login");
  };

  const handleLogin = async () => {
    setError(""); setInfo("");
    if (!emailValid) return setError("Enter a valid email address.");
    if (!password) return setError("Enter your password.");
    setBusy(true);
    const { data, error: err } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    setBusy(false);
    if (err) return setError(err.message);
    onSession(data.session);
  };

  return (
    <div style={{ minHeight: "100vh", background: COLORS.navy, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "system-ui, -apple-system, sans-serif", padding: 20 }}>
      <div style={{ width: 380, maxWidth: "100%", background: "#fff", borderRadius: 12, padding: 32, boxShadow: "0 20px 60px rgba(0,0,0,0.35)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
          <div style={{ width: 36, height: 36, borderRadius: 8, background: COLORS.gold, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 15, color: "#fff" }}>CR</div>
          <div>
            <div style={{ fontSize: 15.5, fontWeight: 700, color: COLORS.navy }}>Call Report Desk</div>
            <div style={{ fontSize: 11.5, color: COLORS.textMuted }}>Global Transaction Banking Services</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 4, marginBottom: 22, background: "#F2F3F5", borderRadius: 8, padding: 3 }}>
          {["login", "signup"].map((m) => (
            <button key={m} onClick={() => { setMode(m); setError(""); setInfo(""); }} style={{
              flex: 1, padding: "8px 0", borderRadius: 6, border: "none", fontSize: 13, fontWeight: 600,
              background: mode === m ? "#fff" : "transparent", color: mode === m ? COLORS.navy : COLORS.textMuted,
              boxShadow: mode === m ? "0 1px 3px rgba(0,0,0,0.12)" : "none",
            }}>{m === "login" ? "Log In" : "Sign Up"}</button>
          ))}
        </div>
        <Field label="Email">
          <div style={{ position: "relative" }}>
            <div style={{ position: "absolute", left: 11, top: 10, color: COLORS.textMuted }}><Icon name="mail" size={14} /></div>
            <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@bank.com" style={{ ...inputStyle, paddingLeft: 32 }} type="email" />
          </div>
        </Field>
        <Field label="Password">
          <div style={{ position: "relative" }}>
            <div style={{ position: "absolute", left: 11, top: 10, color: COLORS.textMuted }}><Icon name="lock" size={14} /></div>
            <input value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" style={{ ...inputStyle, paddingLeft: 32 }} type="password" />
          </div>
        </Field>
        {mode === "signup" && (
          <Field label="Confirm Password">
            <div style={{ position: "relative" }}>
              <div style={{ position: "absolute", left: 11, top: 10, color: COLORS.textMuted }}><Icon name="lock" size={14} /></div>
              <input value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} placeholder="••••••••" style={{ ...inputStyle, paddingLeft: 32 }} type="password" />
            </div>
          </Field>
        )}
        {error && (
          <div style={{ display: "flex", gap: 7, alignItems: "flex-start", background: COLORS.dangerLight, color: COLORS.danger, fontSize: 12.5, padding: "9px 11px", borderRadius: 6, marginBottom: 16 }}>
            <Icon name="alert" size={14} color={COLORS.danger} /> {error}
          </div>
        )}
        {info && (
          <div style={{ display: "flex", gap: 7, alignItems: "flex-start", background: COLORS.tealLight, color: COLORS.teal, fontSize: 12.5, padding: "9px 11px", borderRadius: 6, marginBottom: 16 }}>
            <Icon name="check" size={14} color={COLORS.teal} /> {info}
          </div>
        )}
        <button onClick={mode === "login" ? handleLogin : handleSignup} disabled={busy} style={{ width: "100%", padding: "11px 0", background: COLORS.navy, color: "#fff", border: "none", borderRadius: 7, fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          <Icon name={busy ? "history" : "user"} size={15} spin={busy} />
          {mode === "login" ? "Log In" : "Create Account"}
        </button>
        <div style={{ fontSize: 11.5, color: COLORS.textMuted, marginTop: 16, lineHeight: 1.5, textAlign: "center" }}>
          Your account works from any device — this is a real hosted database.
        </div>
      </div>
    </div>
  );
}

function CallReportApp() {
  const [checking, setChecking] = useState(true);
  const [session, setSession] = useState(null);
  const [view, setView] = useState("new");
  const [companies, setCompanies] = useState([]);
  const [reports, setReports] = useState([]);
  const [apiKey, setApiKey] = useState("");
  const [dataLoaded, setDataLoaded] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3200); };
  const userId = session && session.user && session.user.id;

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setChecking(false); });
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!userId) return;
    setApiKey(localStorage.getItem(`apikey:${userId}`) || "");
    refreshAll();
  }, [userId]);

  const refreshAll = async () => {
    setDataLoaded(false);
    const [{ data: comp, error: e1 }, { data: rep, error: e2 }] = await Promise.all([
      sb.from("companies").select("*").order("name"),
      sb.from("call_reports").select("*").order("meeting_date", { ascending: false }),
    ]);
    if (e1) showToast("Could not load companies: " + e1.message);
    if (e2) showToast("Could not load reports: " + e2.message);
    setCompanies(comp || []);
    setReports(rep || []);
    setDataLoaded(true);
  };

  const saveApiKey = (key) => { setApiKey(key); localStorage.setItem(`apikey:${userId}`, key); };
  const handleLogout = async () => { await sb.auth.signOut(); setCompanies([]); setReports([]); setView("new"); };

  if (checking) return <CenterSpinner />;
  if (!session) return <AuthView onSession={setSession} />;
  if (!dataLoaded) return <CenterSpinner />;

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, fontFamily: "system-ui, -apple-system, 'Segoe UI', sans-serif", color: COLORS.text }}>
      <div style={{ background: COLORS.navy, color: "#fff", padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 34, height: 34, borderRadius: 8, background: COLORS.gold, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 15 }}>CR</div>
          <div>
            <div style={{ fontSize: 16, fontWeight: 700, letterSpacing: 0.2 }}>Call Report Desk</div>
            <div style={{ fontSize: 11.5, color: "#A7B4C6" }}>Global Transaction Banking Services</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          <nav style={{ display: "flex", gap: 4 }}>
            {[["new", "New Report", "file"], ["history", "History", "history"], ["companies", "Companies", "building"], ["settings", "Settings", "lock"]].map(([key, label, icon]) => (
              <button key={key} className="navbtn" onClick={() => setView(key)} style={{
                display: "flex", alignItems: "center", gap: 7, padding: "8px 12px", borderRadius: 6, border: "none",
                background: view === key ? "rgba(255,255,255,0.12)" : "transparent",
                color: view === key ? "#fff" : "#B8C2D2", fontSize: 13, fontWeight: 500,
              }}><Icon name={icon} size={14} /> {label}</button>
            ))}
          </nav>
          <button onClick={handleLogout} title="Log out" style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: "none", color: "#B8C2D2", fontSize: 12.5, padding: "8px 10px", borderRadius: 6 }}>
            <Icon name="logOut" size={14} /> Log out
          </button>
        </div>
      </div>

      <div style={{ maxWidth: 980, margin: "0 auto", padding: "24px 16px 60px" }}>
        {view === "new" && <NewReportView companies={companies} apiKey={apiKey} showToast={showToast} onSaved={refreshAll} />}
        {view === "history" && <HistoryView companies={companies} reports={reports} />}
        {view === "companies" && <CompaniesView companies={companies} showToast={showToast} onChanged={refreshAll} />}
        {view === "settings" && <SettingsView apiKey={apiKey} saveApiKey={saveApiKey} showToast={showToast} email={session.user.email} />}

        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: COLORS.navy, color: "#fff", padding: "11px 20px", borderRadius: 8, fontSize: 13.5, display: "flex", alignItems: "center", gap: 8, boxShadow: "0 8px 24px rgba(0,0,0,0.25)", zIndex: 50, maxWidth: "90vw", textAlign: "center" }}>
          <Icon name="check" size={15} color={COLORS.gold} /> {toast}
        </div>
      )}
    </div>
  );
}

    setCorrected(null); setSavedReport(null);
  };

  const runCorrection = async () => {
    if (!apiKey) { showToast("Add your Claude API key in Settings first"); return; }
    if (!discussionPoints.trim() && !actionables.trim()) { showToast("Add discussion points or actionables first"); return; }
    setCorrecting(true);
    try {
      const system = 'You correct spelling and grammar in banking call-report notes. Keep the meaning, facts, names, and figures exactly as given. Do not add content. Return ONLY valid JSON with keys "discussionPoints" and "actionables", no markdown, no preamble.';
      const user = `Discussion Points:\n${discussionPoints || "(none)"}\n\nActionables:\n${actionables || "(none)"}`;
      const raw = await callClaude(apiKey, system, user);
      const clean = raw.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      setCorrected({ discussionPoints: parsed.discussionPoints || discussionPoints, actionables: parsed.actionables || actionables });
    } catch (e) {
      showToast("Correction failed: " + e.message);
    } finally { setCorrecting(false); }
  };

  const finalDiscussion = corrected ? corrected.discussionPoints : discussionPoints;
  const finalActionables = corrected ? corrected.actionables : actionables;
  const canSave = company && date && (repsClient || repsOurs || finalDiscussion || finalActionables);

  const handleSave = async () => {
    setSaving(true);
    const row = {
      company_id: company.id, customer_id: company.customer_id, company_name: company.name,
      segment: company.segment, avg_balance: company.avg_balance, existing_products: company.existing_products,
      meeting_date: date, reps_client: repsClient, reps_ours: repsOurs, products_discussed: productsDiscussed,
      discussion_points: finalDiscussion, actionables: finalActionables,
    };
    const { data, error } = await sb.from("call_reports").insert(row).select().single();
    setSaving(false);
    if (error) { showToast("Save failed: " + error.message); return; }
    setSavedReport(data);
    showToast("Call report saved");
    onSaved();
  };

  if (savedReport) {
    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
          <Icon name="check" size={20} color={COLORS.teal} />
          <div style={{ fontSize: 16, fontWeight: 700, color: COLORS.navy }}>Report saved for {savedReport.company_name}</div>
        </div>
        <SectionCard title="Report Actions" icon="file">
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <ActionButton icon="download" label="Download as Word" onClick={() => downloadWord(savedReport)} primary />
            <ActionButton icon="plus" label="Start Another Report" onClick={resetForm} />
          </div>
        </SectionCard>
        <ReportPreview report={savedReport} />
      </div>
    );
  }

  return (
    <div>
      <SectionCard title="Select Company" icon="building">
        <Field label="Company Name">
          <select value={companyId} onChange={(e) => setCompanyId(e.target.value)} style={{ ...inputStyle, appearance: "auto" }}>
            <option value="">— Select a company —</option>
            {companies.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </Field>
        {company && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginTop: 4 }}>
            <Field label="Segment"><div style={readonlyBox}><Pill tone="gold">{company.segment}</Pill></div></Field>
            <Field label="Customer ID"><div style={readonlyBox}>{company.customer_id}</div></Field>
            <Field label="Avg. Monthly Balance (prev. month)"><div style={readonlyBox}>₹ {fmtBalance(company.avg_balance)}</div></Field>
            <Field label="Existing Products"><div style={readonlyBox}>{company.existing_products || "—"}</div></Field>
          </div>
        )}
      </SectionCard>

      {company && (
        <React.Fragment>
          <SectionCard title="Meeting Details" icon="calendar">
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <Field label="Date of Meeting" hint="Defaults to today — edit if needed">
                <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} />
              </Field>
              <Field label="Products Discussed">
                <input value={productsDiscussed} onChange={(e) => setProductsDiscussed(e.target.value)} placeholder="e.g. Trade Finance, Cash Management" style={inputStyle} />
              </Field>
              <Field label="Representatives — Client Side">
                <input value={repsClient} onChange={(e) => setRepsClient(e.target.value)} placeholder="Names, designations" style={inputStyle} />
              </Field>
              <Field label="Representatives — Our Side">
                <input value={repsOurs} onChange={(e) => setRepsOurs(e.target.value)} placeholder="Names, designations" style={inputStyle} />
              </Field>
            </div>
          </SectionCard>

          <SectionCard title="Discussion & Actionables" icon="message" right={
            <button onClick={runCorrection} disabled={correcting} style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.tealLight, color: COLORS.teal, border: "none", borderRadius: 6, padding: "7px 12px", fontSize: 12.5, fontWeight: 600 }}>
              <Icon name={correcting ? "history" : "sparkles"} size={13} spin={correcting} />
              {correcting ? "Correcting…" : "Correct spelling & grammar"}
            </button>
          }>
            <Field label="Discussion Points">
              <textarea rows={5} value={corrected ? corrected.discussionPoints : discussionPoints}
                onChange={(e) => corrected ? setCorrected({ ...corrected, discussionPoints: e.target.value }) : setDiscussionPoints(e.target.value)}
                placeholder="Key points raised during the meeting…" style={{ ...inputStyle, resize: "vertical" }} />
            </Field>
            <Field label="Actionables">
              <textarea rows={4} value={corrected ? corrected.actionables : actionables}
                onChange={(e) => corrected ? setCorrected({ ...corrected, actionables: e.target.value }) : setActionables(e.target.value)}
                placeholder="Follow-up items, owners, timelines…" style={{ ...inputStyle, resize: "vertical" }} />
            </Field>
            {corrected && (
              <div style={{ fontSize: 12, color: COLORS.teal, display: "flex", alignItems: "center", gap: 5 }}>
                <Icon name="check" size={13} /> Corrected version applied — you can still edit above.
              </div>
            )}
            {!apiKey && (
              <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 4 }}>
                Add a Claude API key in Settings to enable spelling & grammar correction.
              </div>
            )}
          </SectionCard>

          <div style={{ display: "flex", justifyContent: "flex-end" }}>
            <ActionButton icon="save" label={saving ? "Saving…" : "Save Call Report"} onClick={handleSave} disabled={!canSave || saving} primary />
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

const TEMPLATE_HEADERS = ["Company Name", "Segment", "Customer ID", "Average Monthly Balance", "Existing Products"];

function downloadTemplate() {
  const sample = [
    ["Acme Manufacturing Ltd.", "Corporate", "CUS-100001", "25000000", "Cash Credit, Trade Finance"],
    ["Blue Ridge Traders", "SME", "CUS-100002", "3200000", "Overdraft"],
  ];
  const rows = [TEMPLATE_HEADERS, ...sample];
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "company_data_template.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function normalizeHeader(h) { return String(h || "").trim().toLowerCase().replace(/[^a-z0-9]/g, ""); }

const HEADER_MAP = {
  companyname: "name", name: "name", segment: "segment",
  customerid: "customer_id", custid: "customer_id", id: "customer_id",
  averagemonthlybalance: "avg_balance", avgmonthlybalance: "avg_balance", amb: "avg_balance", monthlybalance: "avg_balance",
  existingproducts: "existing_products", products: "existing_products",
};

function rowsToCompanyObjects(rows) {
  if (!rows.length) return [];
  const headerRow = rows[0].map(normalizeHeader);
  const fieldOrder = headerRow.map((h) => HEADER_MAP[h] || null);
  return rows.slice(1)
    .filter((r) => r.some((cell) => String(cell || "").trim() !== ""))
    .map((r) => {
      const obj = { name: "", segment: SEGMENTS[0], customer_id: "", avg_balance: "", existing_products: "" };
      fieldOrder.forEach((field, i) => { if (field && r[i] !== undefined) obj[field] = String(r[i]).trim(); });
      return obj;
    })
    .filter((o) => o.customer_id);
}

function CompaniesView({ companies, showToast, onChanged }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: "", segment: SEGMENTS[0], customer_id: "", avg_balance: "", existing_products: "" });
  const fileInputRef = useRef(null);
  const [uploadSummary, setUploadSummary] = useState(null);
  const [busy, setBusy] = useState(false);

  const startNew = () => { setForm({ name: "", segment: SEGMENTS[0], customer_id: "", avg_balance: "", existing_products: "" }); setEditing("new"); };
  const startEdit = (c) => { setForm(c); setEditing(c.id); };

  const handleSave = async () => {
    if (!form.name.trim()) { showToast("Company name is required"); return; }
    if (!form.customer_id.trim()) { showToast("Customer ID is required"); return; }
    setBusy(true);
    const { error } = await sb.from("companies").upsert(
      { name: form.name, segment: form.segment, customer_id: form.customer_id.trim(), avg_balance: form.avg_balance, existing_products: form.existing_products, user_id: (await sb.auth.getUser()).data.user.id },
      { onConflict: "user_id,customer_id" }
    );
    setBusy(false);
    if (error) { showToast("Save failed: " + error.message); return; }
    showToast(editing === "new" ? "Company added" : "Company updated");
    setEditing(null);
    onChanged();
  };

  const handleDelete = async (id) => {
    const { error } = await sb.from("companies").delete().eq("id", id);
    if (error) { showToast("Delete failed: " + error.message); return; }
    showToast("Company removed");
    onChanged();
  };

  const processRows = async (companyObjects) => {
    if (!companyObjects.length) { showToast("No valid rows found — check Customer ID column"); return; }
    setBusy(true);
    const existingIds = new Set(companies.map((c) => c.customer_id));
    const added = companyObjects.filter((r) => !existingIds.has(r.customer_id)).length;
    const updated = companyObjects.length - added;
    const userId = (await sb.auth.getUser()).data.user.id;
    const rows = companyObjects.map((r) => ({ ...r, user_id: userId }));
    const { error } = await sb.from("companies").upsert(rows, { onConflict: "user_id,customer_id" });
    setBusy(false);
    if (error) { showToast("Upload failed: " + error.message); return; }
    setUploadSummary({ added, updated, total: companyObjects.length });
    showToast(`${added} added, ${updated} updated by Customer ID`);
    onChanged();
  };

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext === "csv") {
      Papa.parse(file, { complete: (result) => processRows(rowsToCompanyObjects(result.data)) });
    } else {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const wb = XLSX.read(ev.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        processRows(rowsToCompanyObjects(rows));
      };
      reader.readAsArrayBuffer(file);
    }
    e.target.value = "";
  };

  return (
    <div>
      <SectionCard title="Monthly Company Data Update" icon="upload" right={
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <ActionButton icon="fileDown" label="Template" onClick={downloadTemplate} />
          <ActionButton icon="upload" label="Upload" onClick={() => fileInputRef.current.click()} primary disabled={busy} />
          <input ref={fileInputRef} type="file" accept=".csv,.xlsx,.xls" onChange={handleFile} style={{ display: "none" }} />
        </div>
      }>
        <div style={{ fontSize: 13, color: COLORS.slate, lineHeight: 1.6 }}>
          Upload a CSV or Excel file each month with updated <strong>Average Monthly Balance</strong> and <strong>Existing Products</strong>.
          Rows are matched to companies by <strong>Customer ID</strong> — matching rows update the existing record, new Customer IDs are
          added as new companies. Past call reports keep the company details as they were on the meeting date and are never altered by this update.
        </div>
        {uploadSummary && (
          <div style={{ marginTop: 12, fontSize: 12.5, color: COLORS.teal, display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name="check" size={13} /> Last upload: {uploadSummary.added} added, {uploadSummary.updated} updated ({uploadSummary.total} rows processed).
          </div>
        )}
      </SectionCard>

      <SectionCard title="Managed Companies" icon="building" right={<ActionButton icon="plus" label="Add Company" onClick={startNew} />}>
        {companies.length === 0 ? (
          <div style={{ color: COLORS.textMuted, fontSize: 13.5 }}>No companies yet — add one or upload a file to get started.</div>
        ) : (
          companies.map((c) => (
            <div key={c.id} className="rowhover" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 8px", borderBottom: `1px solid ${COLORS.border}` }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.navy }}>{c.name}</div>
                <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginTop: 2 }}>{c.customer_id} · <Pill tone="gold">{c.segment}</Pill> · ₹ {fmtBalance(c.avg_balance)}</div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <IconBtn icon="pencil" onClick={() => startEdit(c)} />
                <IconBtn icon="trash" onClick={() => handleDelete(c.id)} danger />
              </div>
            </div>
          ))
        )}
      </SectionCard>

      {editing && (
        <SectionCard title={editing === "new" ? "Add Company" : "Edit Company"} icon={editing === "new" ? "plus" : "pencil"}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            <Field label="Company Name"><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} style={inputStyle} /></Field>
            <Field label="Segment">
              <select value={form.segment} onChange={(e) => setForm({ ...form, segment: e.target.value })} style={inputStyle}>
                {SEGMENTS.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
            <Field label="Customer ID" hint="Unique identifier — used to match updates">
              <input value={form.customer_id} onChange={(e) => setForm({ ...form, customer_id: e.target.value })} disabled={editing !== "new"} style={{ ...inputStyle, background: editing !== "new" ? "#FAFBFC" : "#fff" }} />
            </Field>
            <Field label="Avg. Monthly Balance (previous month)"><input value={form.avg_balance} onChange={(e) => setForm({ ...form, avg_balance: e.target.value })} placeholder="Numeric value" style={inputStyle} /></Field>
          </div>
          <Field label="Existing Products"><input value={form.existing_products} onChange={(e) => setForm({ ...form, existing_products: e.target.value })} placeholder="Comma-separated" style={inputStyle} /></Field>
          <div style={{ display: "flex", gap: 10 }}>
            <ActionButton icon="save" label="Save" onClick={handleSave} primary disabled={busy} />
            <ActionButton icon="x" label="Cancel" onClick={() => setEditing(null)} />
          </div>
        </SectionCard>
      )}
    </div>
  );
}

    </div>
    <table>
      <tr><td class="label">Average Monthly Balance (previous month)</td><td>₹ ${fmtBalance(report.avg_balance)}</td></tr>
      <tr><td class="label">Existing Products</td><td>${report.existing_products || "—"}</td></tr>
      <tr><td class="label">Products Discussed</td><td>${report.products_discussed || "—"}</td></tr>
      <tr><td class="label">Representatives — Client Side</td><td>${report.reps_client || "—"}</td></tr>
      <tr><td class="label">Representatives — Our Side</td><td>${report.reps_ours || "—"}</td></tr>
    </table>
    <h2>Discussion Points</h2>
    <p>${(report.discussion_points || "—").replace(/</g, "&lt;")}</p>
    <h2>Actionables</h2>
    <p>${(report.actionables || "—").replace(/</g, "&lt;")}</p>
    <div class="footer">Generated by Call Report Desk on ${fmtDate(todayISO())}.</div>
  </body></html>`;
}

function downloadWord(report) {
  const html = reportToHtml(report);
  const blob = new Blob(["\ufeff", html], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = report.company_name.replace(/[^a-z0-9]+/gi, "_");
  a.href = url; a.download = `${safeName}_CallReport_${report.meeting_date}.doc`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(sb ? <CallReportApp /> : <ConfigMissing />);
} catch (e) {
  showFatalError(e.message);
}

</script>
</body>
</html>
